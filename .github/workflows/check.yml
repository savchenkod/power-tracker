name: Power check

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (минимум для GitHub; бывают задержки)
  workflow_dispatch:        # ручной запуск из вкладки Actions

permissions:
  contents: write           # чтобы сохранить state.json в репозиторий

concurrency:
  group: power-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relay
        env:
          RELAY_SN: ${{ secrets.RELAY_SN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_power.py

      - name: Save state
        run: |
          git config user.name "power-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
